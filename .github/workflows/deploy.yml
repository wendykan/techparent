name: Deploy Hugo to Firebase
on:
  push:
    branches:
      - master  # 如果您的主分支是 master，請改為 master

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # 確保拉取舊主題 submodule
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.110.0' # 鎖定舊版本以相容 5 年前的主題
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: techparent-98fe5 # 請替換成您的專案 ID
          channelId: live
